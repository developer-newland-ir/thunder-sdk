plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    signingConfigs {
        Sadad {
            storeFile file('..\\app\\ThunderLight_Sadad.jks')
            storePassword 'TLs@dad2022'
            keyPassword 'TLs@dad2022'
            keyAlias 'ThunderLight_Sadad'
        }
    }

    namespace 'com.thunderlight.thundersmartsdk'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 5
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        signingConfig signingConfigs.Sadad
    }

    buildTypes {
        release {
            minifyEnabled true
            debuggable false
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfigs.Sadad
        }
        debug {
            minifyEnabled true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    libraryVariants.all { variant ->
        variant.outputs.all {
            def project = "ThunderSmart-SDK"
            def SEP = "_"
            def versionName = defaultConfig.versionName
            def versionCode = defaultConfig.versionCode

            def date = new Date()
            def formattedDate = date.format('yyyyMMdd_HHmm')

            outputFileName = project + SEP + versionName + SEP + versionCode + SEP + formattedDate + ".aar"
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    //Gson
    implementation 'com.google.code.gson:gson:2.10.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.developer-newland-ir'
                artifactId = 'thunder-sdk'
                version = '1.2-alpha'
            }
        }
    }
}